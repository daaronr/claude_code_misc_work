  uj-prioritization:
    display_name: "Unjournal Research Prioritization Tool"
    category: "Unjournal Core"
    github: "https://github.com/daaronr/uj-prioritization"
    hosted: "https://uj-prioritization-prototype.netlify.app"
    description: |
      AI-powered pipeline for discovering, scoring, and prioritizing research papers for
      Unjournal's evaluation workflow. Pulls from NBER, arXiv, CEPR, EA Forum, Semantic Scholar,
      Zotero, and RePEC; deduplicates against the Unjournal DB; scores with LLMs (GPT-4o-mini,
      Claude); syncs high-scoring papers to Zotero; and deploys a public Netlify dashboard.
      Flask API layer handles team feedback with privacy controls.
    goals:
      - Weekly automated pipeline (cron Mon/Thu) to surface new high-priority papers
      - LLM scoring calibrated against existing Unjournal evaluations
      - Public Netlify dashboard for browsing prioritized papers
      - Zotero two-way sync (public group for score≥65, private for all)
      - Flask API for internal team scoring and feedback
    status: "active"
    status_note: "Pipeline running, dashboard live"
    next_steps:
      - Expand source coverage (more fetchers)
      - Improve LLM scoring calibration
      - Add team feedback loop to re-rank
    key_sessions:
      - id: ""
        description: "Main pipeline and dashboard work"

