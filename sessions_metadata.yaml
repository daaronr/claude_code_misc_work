# Categories for organizing the output
categories:
  - name: "Unjournal Core"
    description: "Main Unjournal project repositories, tools, and workshops"
    priority: 1
  - name: "Research"
    description: "Academic research projects and analysis"
    priority: 2
  - name: "Personal Projects"
    description: "Side projects and personal development"
    priority: 3
  - name: "Admin & Ops"
    description: "Administrative, operations, and internal tools"
    priority: 4

# Status definitions
status_definitions:
  active: "Actively being worked on"
  development: "Under development, not yet complete"
  deployed: "Live and running"
  maintenance: "Stable, occasional updates"
  paused: "On hold, may resume"
  transition: "Being handed off or migrated"
  archived: "No longer active, kept for reference"
  completed: "Finished project"
  hobby: "Casual/occasional work"
